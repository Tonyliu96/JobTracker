# Spring Boot application properties for development. 
# Database (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
notifications.cron=0 0 9 * * *
notifications.zone=Australia/Sydney

# JWT (use env JWT_SECRET in production; must be at least 256 bits / 32 chars for HS256)
jwt.secret=${JWT_SECRET}


# Google OAuth (create OAuth 2.0 Client ID at https://console.cloud.google.com/apis/credentials)
google.client-id=${GOOGLE_CLIENT_ID}
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
server.port=${PORT:8080}
